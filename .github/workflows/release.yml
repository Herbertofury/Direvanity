name: Publish playable checkpoint
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique prerelease tag
        required: true
        default: v0.1.0-alpha.1
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: dreadmarch.exe
          - os: ubuntu-latest
            platform: linux-x64
            binary: dreadmarch
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: rustup show
      - name: Verify simulation
        run: cargo test --workspace --exclude dreadmarch-client --locked
      - name: Build optimized native game
        run: cargo build --locked --release -p dreadmarch-client
      - name: Exercise the optimized GPU renderer offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p dist
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WGPU_BACKEND=vulkan
          export LP_NUM_THREADS=2
          target/release/dreadmarch --smoke-test --screenshot dist/native-smoke.png
      - name: Build shared-simulation browser playtest
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build_web.py
          node tests/web_abi.mjs
          node tests/web_controls.mjs dist/Dreadmarch-playtest.html
      - name: Package native client
        shell: python
        run: |
          import pathlib, shutil, zipfile, hashlib
          root = pathlib.Path('.')
          out = root/'dist'
          out.mkdir(exist_ok=True)
          name = 'Dreadmarch-${{ matrix.platform }}'
          stage = out/name
          stage.mkdir(exist_ok=True)
          for path in ['target/release/${{ matrix.binary }}','README.md','LICENSE-MIT','LICENSE-APACHE','THIRD_PARTY.md']:
              shutil.copy2(path, stage/pathlib.Path(path).name)
          shutil.copytree('docs', stage/'docs', dirs_exist_ok=True)
          with zipfile.ZipFile(out/(name+'.zip'),'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in sorted(stage.rglob('*')):
                  if path.is_file(): z.write(path, name+'/'+str(path.relative_to(stage)))
          package = out/(name+'.zip')
          (out/(name+'.sha256')).write_text(hashlib.sha256(package.read_bytes()).hexdigest()+'  '+package.name+'\n')
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.html
            dist/native-smoke.png
            dist/web-build.json
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish exact source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --prerelease --title "Dreadmarch: first playable foundation" --notes-file docs/RELEASE_NOTES.md
