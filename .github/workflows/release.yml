name: Build verified release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique prerelease tag
        required: true
        default: v0.2.0-alpha.1
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: direvanity.exe
          - os: ubuntu-24.04
            platform: linux-x64
            binary: direvanity
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: rustup show
      - name: Verify simulation
        run: cargo test --workspace --exclude dreadmarch-client --locked
      - name: Native regression tests
        run: cargo test --locked -p dreadmarch-client
      - name: Build optimized native game
        run: cargo build --locked --release -p dreadmarch-client
      - name: Collect dependency and font notices
        run: |
          cargo fetch --locked
          python scripts/collect_notices.py --allow-incomplete
      - name: Exercise the optimized GPU renderer offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          mkdir -p dist
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WGPU_BACKEND=vulkan
          export LP_NUM_THREADS=2
          set -o pipefail
          target/release/direvanity --smoke-test --screenshot dist/native-smoke.png | tee dist/native-smoke.log
          target/release/direvanity --campaign-smoke --screenshot dist/native-campaign-smoke.png | tee dist/native-campaign-smoke.log
      - name: Build shared-simulation browser playtest
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build_web.py
          node tests/web_abi.mjs
          node tests/web_controls.mjs dist/Direvanity-playtest.html
          node tests/rpg_abi.mjs
          node tests/rpg_modifiers.mjs
          node tests/rpg_numeric_boundary.mjs
          node tests/rpg_controls.mjs dist/Direvanity-campaign.html
      - name: Package native client
        shell: python
        run: |
          import pathlib, shutil, zipfile, hashlib, json, subprocess, re
          root = pathlib.Path('.')
          out = root/'dist'
          out.mkdir(exist_ok=True)
          name = 'Direvanity-${{ matrix.platform }}'
          stage = out/name
          stage.mkdir(exist_ok=True)
          for path in ['target/release/${{ matrix.binary }}','README.md','LICENSE-MIT','LICENSE-APACHE','THIRD_PARTY.md','dist/THIRD_PARTY_NOTICES.txt']:
              shutil.copy2(path, stage/pathlib.Path(path).name)
          shutil.copytree('docs', stage/'docs', dirs_exist_ok=True)
          shutil.copytree('data', stage/'data', dirs_exist_ok=True)
          binary = pathlib.Path('target/release/${{ matrix.binary }}')
          receipt = {'schema':1, 'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                     'platform':'${{ matrix.platform }}', 'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'binary_bytes':binary.stat().st_size, 'release_tag':'${{ inputs.tag }}'}
          if '${{ runner.os }}' == 'Linux':
              symbols = subprocess.check_output(['objdump','-T',str(binary)],text=True)
              versions = {tuple(map(int,v.split('.'))) for v in re.findall(r'GLIBC_([0-9.]+)',symbols)}
              required = max(versions)
              assert required <= (2,39), f'glibc requirement exceeded: {required}'
              receipt['required_glibc'] = '.'.join(map(str,required))
              receipt['smoke_log_files'] = ['native-smoke.log','native-campaign-smoke.log']
          else:
              receipt['runtime_boundary'] = 'Build and native tests verified; Windows GPU/window runtime not exercised here.'
          (stage/'BUILD-RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with zipfile.ZipFile(out/(name+'.zip'),'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for path in sorted(stage.rglob('*')):
                  if path.is_file(): z.write(path, name+'/'+str(path.relative_to(stage)))
          package = out/(name+'.zip')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          (out/(name+'.sha256')).write_text(digest+'  '+package.name+'\n')
          receipt['package_sha256'] = digest
          (out/(name+'-receipt.json')).write_text(json.dumps(receipt,indent=2)+'\n')
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.html
            dist/native-smoke.png
            dist/native-campaign-smoke*.png
            dist/*smoke.log
            dist/*receipt.json
            dist/web-build.json
            dist/campaign-build.json
            dist/rpg-abi-proof.json
            dist/rpg-controls-proof.json
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

# Publication uses the authenticated repository UI after artifact verification. The previous
# installation-token release-create route returned HTTP403; do not repeat it or broaden token access.
