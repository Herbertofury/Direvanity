[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/dread-core", "crates/dread-sim", "apps/dread-headless"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Herbertofury/Dreadmarch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dread-core = { path = "crates/dread-core" }
dread-sim = { path = "crates/dread-sim" }
bevy = { version = "=0.20.1", default-features = false }

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
